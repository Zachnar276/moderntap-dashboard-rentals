<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your houses · ModernTap</title>
  <link rel="stylesheet" href="/css/dash.css">
  <link rel="stylesheet" href="/css/beach.css">
  <style>main { max-width: 1040px; }</style>
</head>
<body>
  <header class="beach-head" data-beach-scene>
    <div class="inner">
      <div class="bh-bar">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9a8 8 0 0 1 12 0"/><path d="M8.5 12a4.5 4.5 0 0 1 7 0"/><circle cx="12" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>ModernTap <small>· Outer Banks</small></span>
        <div class="who"><span id="who"></span> · <button class="linkbtn" id="signout" type="button">Sign out</button></div>
      </div>
      <h1 id="title">Your houses</h1>
    </div>
  </header>
  <main>

    <div class="controls">
      <div class="filters" role="group" aria-label="Date range">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90">90 days</button>
      </div>
      <label class="switch">House
        <select data-house-switcher data-current="all" disabled><option>Loading…</option></select>
      </label>
    </div>

    <p id="status" class="status">Loading…</p>

    <div id="content" class="content hidden">
      <div id="demo" class="demo-banner hidden" role="note"></div>
      <section class="card hero">
        <div class="label">Rebooking taps, all houses</div>
        <div class="value" id="rebook-value">–</div>
        <div class="delta" id="rebook-delta"></div>
      </section>

      <div class="tiles three">
        <section class="card tile">
          <div class="label">Potential rebooks (clicks)</div>
          <div class="value" id="clicks-value">–</div>
          <div class="delta" id="clicks-delta"></div>
          <div class="hint">Guests who pressed “Choose your dates”</div>
        </section>
        <section class="card tile">
          <div class="label">Total taps</div>
          <div class="value" id="total-value">–</div>
          <div class="delta" id="total-delta"></div>
        </section>
        <section class="card tile">
          <div class="label">Average per house</div>
          <div class="value" id="avg-value">–</div>
          <div class="hint" id="avg-sub"></div>
        </section>
      </div>

      <section class="card" id="breakdown">
        <div class="section-head" style="flex-wrap:wrap">
          <div>
            <h2>Where the numbers come from</h2>
            <p class="sub" id="bd-sub" style="margin:0">Each house’s share of the total</p>
          </div>
          <div class="seg-tabs" role="group" aria-label="Breakdown measure">
            <button type="button" data-bd="rebookTaps" aria-pressed="true">Rebooking taps</button>
            <button type="button" data-bd="rebookClicks" aria-pressed="false">Potential rebooks</button>
            <button type="button" data-bd="types" aria-pressed="false">All taps, by plaque type</button>
          </div>
        </div>
        <div class="bd-legend hidden" id="bd-legend"></div>
        <div id="bd-rows"></div>
        <details>
          <summary>Show as table</summary>
          <div class="table-wrap"><table id="bd-table"></table></div>
        </details>
      </section>

      <div class="sort-row">
        <h2>Houses</h2>
        <label>Sort by
          <select id="sort">
            <option value="rebookTaps">Rebooking taps</option>
            <option value="rebookClicks">Potential rebooks</option>
            <option value="totalTaps">Total taps</option>
            <option value="alerts">Plaque alerts</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
      <div class="houses" id="houses"></div>
      <div data-defs style="margin-top:16px"></div>
    </div>
  </main>

  <script src="/js/beach.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/switcher.js"></script>
  <script src="/js/defs.js"></script>
  <script>
  (function () {
    if (!MTAuth.requireSignIn()) return;

    var params = new URLSearchParams(location.search);
    var days = [7, 30, 90].indexOf(Number(params.get('days'))) >= 0 ? Number(params.get('days')) : 30;
    var current = null;
    var SVG_NS = 'http://www.w3.org/2000/svg';

    function $(id) { return document.getElementById(id); }
    function fmt(n) { return Number(n).toLocaleString('en-US'); }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function renderDelta(node, now, prev, short) {
      node.textContent = '';
      if (prev == null) return;
      var period = short ? '' : ' vs previous ' + days + ' days';
      if (prev === 0) { node.textContent = now === 0 ? 'No change' + period : 'New this period'; return; }
      var pct = Math.round(((now - prev) / prev) * 100);
      if (pct === 0) { node.textContent = 'No change' + period; return; }
      node.appendChild(el('span', pct > 0 ? 'up' : 'down', (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%'));
      node.appendChild(document.createTextNode(period));
    }

    // Tiny trend line of daily taps (single series, so no legend; the card says what it is).
    function sparkline(values) {
      var W = 300, H = 36, pad = 3;
      var max = Math.max.apply(null, values.concat([1]));
      var step = values.length > 1 ? (W - pad * 2) / (values.length - 1) : 0;
      var pts = values.map(function (v, i) {
        return [pad + i * step, H - pad - (v / max) * (H - pad * 2)];
      });
      var svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      var area = document.createElementNS(SVG_NS, 'path');
      area.setAttribute('d', 'M' + pts.map(function (p) { return p.join(','); }).join('L') +
        'L' + (W - pad) + ',' + (H - pad) + 'L' + pad + ',' + (H - pad) + 'Z');
      area.setAttribute('fill', 'var(--series-rebook)');
      area.setAttribute('opacity', '0.1');
      var line = document.createElementNS(SVG_NS, 'path');
      line.setAttribute('d', 'M' + pts.map(function (p) { return p.join(','); }).join('L'));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--series-rebook)');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-linejoin', 'round');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(area);
      svg.appendChild(line);
      return svg;
    }

    function renderHouses() {
      var key = $('sort').value;
      var list = current.houses.slice().sort(function (a, b) {
        if (key === 'name') return String(a.name).localeCompare(String(b.name));
        if (key === 'alerts') return (b.alerts || []).length - (a.alerts || []).length || String(a.name).localeCompare(String(b.name));
        return b[key] - a[key] || String(a.name).localeCompare(String(b.name));
      });
      var wrap = $('houses');
      wrap.textContent = '';
      if (!list.length) {
        wrap.appendChild(el('p', 'sub', 'No houses are linked to your account yet.'));
        return;
      }
      // Rank by rebooking taps (ties share a rank) and compare with the portfolio average.
      var ranked = current.houses.slice().sort(function (a, b) { return b.rebookTaps - a.rebookTaps; });
      var avg = current.houses.length ? current.totals.rebookTaps / current.houses.length : 0;
      list.forEach(function (h) {
        var a = el('a', 'house');
        a.href = '/property.html?p=' + encodeURIComponent(h.id) + '&days=' + days;
        var top = el('div', 'top');
        top.appendChild(el('div', 'name', h.name));
        if (current.houses.length > 1) {
          var rank = 1 + ranked.filter(function (x) { return x.rebookTaps > h.rebookTaps; }).length;
          top.appendChild(el('span', 'rank', '#' + rank + ' of ' + current.houses.length));
        }
        a.appendChild(top);
        a.appendChild(el('div', 'tag', h.tagline || ' '));
        var nums = el('div', 'nums');
        function num(value, label, lead, now, prev) {
          var n = el('div', 'num' + (lead ? ' lead' : ''));
          n.appendChild(el('div', 'v', fmt(value)));
          n.appendChild(el('div', 'l', label));
          if (prev != null) { var d = el('div', 'delta'); renderDelta(d, now, prev, true); n.appendChild(d); }
          nums.appendChild(n);
        }
        num(h.rebookTaps, 'Rebooking taps', true, h.rebookTaps, h.prevRebookTaps);
        num(h.rebookClicks, 'Potential rebooks', false, h.rebookClicks, h.prevRebookClicks);
        num(h.totalTaps, 'Total taps', false);
        a.appendChild(nums);
        if (current.houses.length > 1 && avg > 0) {
          var diff = Math.round(((h.rebookTaps - avg) / avg) * 100);
          var va = el('div', 'vsavg');
          va.textContent = diff === 0 ? 'Right at your average for rebooking taps'
            : (diff > 0 ? '▲ ' : '▼ ') + Math.abs(diff) + '% ' + (diff > 0 ? 'above' : 'below') + ' your average for rebooking taps';
          a.appendChild(va);
        }
        if (h.alerts && h.alerts.length) {
          var al = el('div', 'alerts');
          h.alerts.forEach(function (x) {
            al.appendChild(el('span', 'pill warn', '⚠ ' + x.spot + ': ' + (x.status === 'silent' ? 'not being used' : 'low use')));
          });
          a.appendChild(al);
        }
        var sp = el('div', 'spark');
        sp.appendChild(sparkline(h.daily));
        sp.setAttribute('title', 'Daily taps, last ' + days + ' days');
        a.appendChild(sp);
        a.setAttribute('aria-label', h.name + ': ' + h.rebookTaps + ' rebooking taps, ' +
          h.rebookClicks + ' potential rebooks, ' + h.totalTaps + ' total taps' +
          (h.alerts && h.alerts.length ? ', ' + h.alerts.length + ' plaque alert' + (h.alerts.length === 1 ? '' : 's') : ''));
        wrap.appendChild(a);
      });
    }

    /* ── Where the numbers come from: each house's share, or its taps split by plaque type ── */
    var TYPES = ['rebook', 'wifi', 'guide', 'review', 'local', 'other'];
    var TYPE_LABELS = { rebook: 'Rebooking', wifi: 'Wi-Fi', guide: 'Guidebook', review: 'Review', local: 'Local tips', other: 'Other' };
    var bdMode = 'rebookTaps';

    function renderBreakdown() {
      var rows = $('bd-rows'), table = $('bd-table'), legend = $('bd-legend');
      rows.textContent = ''; table.textContent = ''; legend.textContent = '';
      var houses = current.houses;
      var typed = bdMode === 'types';
      var value = function (h) { return typed ? h.totalTaps : h[bdMode]; };
      var total = houses.reduce(function (n, h) { return n + value(h); }, 0);
      var max = Math.max.apply(null, houses.map(value).concat([1]));
      $('bd-sub').textContent = typed
        ? 'Every tap at each house, split by what the plaque opens'
        : 'Each house’s share of ' + fmt(total) + ' ' + (bdMode === 'rebookTaps' ? 'rebooking taps' : 'potential rebooks (clicks)');
      // Only show plaque types that actually have taps, in the fixed color order.
      var usedTypes = TYPES.filter(function (t) { return houses.some(function (h) { return h.byType && h.byType[t] > 0; }); });
      legend.classList.toggle('hidden', !typed);
      if (typed) usedTypes.forEach(function (t) {
        var sp = el('span', null, TYPE_LABELS[t]); sp.style.setProperty('--swatch', 'var(--type-' + t + ')'); legend.appendChild(sp);
      });

      houses.slice().sort(function (a, b) { return value(b) - value(a); }).forEach(function (h) {
        var row = el('div', 'bd-row');
        var name = el('a', 'bd-name', h.name);
        name.href = '/property.html?p=' + encodeURIComponent(h.id) + '&days=' + days;
        row.appendChild(name);
        var track = el('div', 'bd-track');
        track.style.width = 'calc(100% * ' + (value(h) / max) + ')';
        if (typed) {
          usedTypes.filter(function (t) { return h.byType[t] > 0; }).forEach(function (t) {
            var seg = el('div', 'bd-seg');
            seg.style.background = 'var(--type-' + t + ')';
            seg.style.flex = h.byType[t] + ' 1 0';
            seg.title = TYPE_LABELS[t] + ': ' + fmt(h.byType[t]) + ' taps';
            track.appendChild(seg);
          });
        } else if (value(h) > 0) {
          var seg = el('div', 'bd-seg');
          seg.style.background = 'var(--series-rebook)';
          seg.style.flex = '1 1 0';
          track.appendChild(seg);
        }
        row.appendChild(track);
        var v = el('div', 'bd-val', fmt(value(h)));
        if (!typed && total) v.appendChild(el('small', null, Math.round((value(h) / total) * 100) + '%'));
        row.appendChild(v);
        row.setAttribute('aria-label', h.name + ': ' + fmt(value(h)) + (typed ? ' taps: ' +
          usedTypes.map(function (t) { return TYPE_LABELS[t] + ' ' + (h.byType[t] || 0); }).join(', ') : ''));
        rows.appendChild(row);
      });

      // Table view (every value, no hovering needed)
      var head = el('tr');
      head.appendChild(el('th', null, 'House'));
      (typed ? usedTypes.map(function (t) { return TYPE_LABELS[t]; }).concat(['Total']) : ['Count', 'Share']).forEach(function (c) {
        var th = el('th', null, c); th.className = 'n'; head.appendChild(th);
      });
      table.appendChild(head);
      houses.forEach(function (h) {
        var tr = el('tr');
        tr.appendChild(el('td', null, h.name));
        var cells = typed ? usedTypes.map(function (t) { return fmt(h.byType[t] || 0); }).concat([fmt(h.totalTaps)])
          : [fmt(value(h)), total ? Math.round((value(h) / total) * 100) + '%' : '–'];
        cells.forEach(function (c) { var td = el('td', null, c); td.className = 'n'; tr.appendChild(td); });
        table.appendChild(tr);
      });
    }

    document.querySelectorAll('[data-bd]').forEach(function (b) {
      b.addEventListener('click', function () {
        bdMode = b.dataset.bd;
        document.querySelectorAll('[data-bd]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        if (current) renderBreakdown();
      });
    });

    function render(data) {
      current = data;
      var u = data.user;
      $('who').textContent = '';
      $('who').appendChild(el('b', null, u.name || u.email));
      $('who').appendChild(el('span', 'role-pill', u.role));
      if (u.role === 'admin' && !$('admin-link')) {
        var a = el('a', 'linkbtn', 'Admin');
        a.id = 'admin-link';
        a.href = '/admin.html';
        $('who').parentNode.insertBefore(a, $('who'));
        $('who').parentNode.insertBefore(document.createTextNode(' · '), $('who'));
      }
      $('title').textContent = u.role === 'owner' ? 'Your houses' : 'All houses';
      var t = data.totals;
      $('rebook-value').textContent = fmt(t.rebookTaps);
      renderDelta($('rebook-delta'), t.rebookTaps, t.prevRebookTaps);
      $('clicks-value').textContent = fmt(t.rebookClicks);
      renderDelta($('clicks-delta'), t.rebookClicks, t.prevRebookClicks);
      $('total-value').textContent = fmt(t.totalTaps);
      renderDelta($('total-delta'), t.totalTaps, t.prevTotalTaps);
      var avg = data.houses.length ? t.rebookTaps / data.houses.length : 0;
      $('avg-value').textContent = avg >= 10 ? fmt(Math.round(avg)) : (Math.round(avg * 10) / 10).toString();
      $('avg-sub').textContent = 'Rebooking taps per house, across ' + data.houses.length + ' house' + (data.houses.length === 1 ? '' : 's');
      var demo = $('demo');
      if (t.demoTaps > 0) {
        demo.textContent = '';
        demo.appendChild(el('b', null, 'Includes demo data.'));
        demo.appendChild(document.createTextNode(' ' + fmt(t.demoTaps) + ' of the ' + fmt(t.totalTaps) +
          ' taps in this period are demo taps that show how the dashboard works. Real numbers start when plaques are installed.'));
        demo.classList.remove('hidden');
      } else { demo.classList.add('hidden'); }
      $('status').classList.add('hidden');
      $('content').classList.remove('hidden');
      renderHouses();
      renderBreakdown();
      MTSwitcher.populate(data.houses.map(function (h) { return { id: h.id, name: h.name }; }));
      $('breakdown').classList.toggle('hidden', data.houses.length < 2);
    }

    function load() {
      document.querySelectorAll('.filters button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days));
      });
      document.body.classList.add('loading');
      MTAuth.api('overview', { days: days })
        .then(function (data) {
          if (!data.ok) throw new Error(data.error || 'Could not load');
          render(data);
        })
        .catch(function (err) {
          if (!current) { $('status').textContent = 'Couldn’t load your houses: ' + err.message; $('status').classList.add('error'); }
        })
        .then(function () { document.body.classList.remove('loading'); });
    }

    document.querySelectorAll('.filters button').forEach(function (b) {
      b.addEventListener('click', function () {
        days = Number(b.dataset.days);
        params.set('days', days);
        history.replaceState(null, '', '?' + params.toString());
        load();
      });
    });
    $('sort').addEventListener('change', function () { if (current) renderHouses(); });
    $('signout').addEventListener('click', MTAuth.signOut);

    load();
  })();
  </script>
</body>
</html>
