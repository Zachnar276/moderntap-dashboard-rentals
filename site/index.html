<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · ModernTap Dashboard</title>
  <link rel="stylesheet" href="/css/dash.css">
  <link rel="stylesheet" href="/css/beach.css">
  <style>
    .signin-scene { min-height: 46vh; }
    .signin { margin: -18vh auto 0; position: relative; z-index: 2; background: var(--surface); border-radius: 22px;
      padding: 28px 24px; box-shadow: 0 10px 40px rgba(11, 58, 83, 0.16); max-width: 420px; }
    .signin .brand { font-weight: 700; color: #0b3a53; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; }
    @media (max-width: 480px) { .signin { margin-left: 12px; margin-right: 12px; } }
  </style>
</head>
<body>
  <div class="signin-scene" data-beach-scene></div>
  <main class="signin">
    <div class="brand">ModernTap · Outer Banks</div>
    <h1>Owner &amp; manager dashboard</h1>
    <p>Sign in with the Google account ModernTap added for you.</p>
    <div id="gsi"></div>
    <div id="msg" class="msg" role="status"></div>
    <div class="fine">Only accounts added by ModernTap can see property stats.</div>
  </main>

  <script src="/js/beach.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    var msg = document.getElementById('msg');

    function show(text, isError) {
      msg.textContent = text;
      msg.className = 'msg' + (isError ? ' error' : '');
    }

    function onCredential(resp) {
      MTAuth.setToken(resp.credential);
      show('Checking access…');
      fetch(MODERNTAP.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'me', token: resp.credential }),
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.ok) { location.replace('/dashboard.html'); return; }
          try { sessionStorage.removeItem('mt_id_token'); } catch (e) {}
          if (data.error === 'not_authorized') {
            show('The account ' + (data.email || '') + ' doesn’t have access yet. Ask ModernTap to add it.', true);
          } else {
            show('Sign-in didn’t work. Please try again.', true);
          }
        })
        .catch(function () { show('Couldn’t reach the server. Check your connection and try again.', true); });
    }

    function initGoogle() {
      google.accounts.id.initialize({
        client_id: MODERNTAP.GOOGLE_CLIENT_ID,
        callback: onCredential,
        auto_select: true,
        ux_mode: 'popup',
      });
      google.accounts.id.renderButton(document.getElementById('gsi'), {
        theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280,
      });
    }

    var p = new URLSearchParams(location.search);
    if (p.get('signed_out')) show('You’ve been signed out.');
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
