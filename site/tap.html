<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f5f0; color: #1f2a33;
    }
    .box { text-align: center; padding: 24px; }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid #d8d3c8; border-top-color: #1f6f8b; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #1f6f8b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>Opening…</div>
    <p id="manual" class="hidden"><a id="manual-link" href="#">Tap here if nothing happens</a></p>
  </div>

  <script src="/js/config.js"></script>
  <script>
    (function () {
      var cfg = window.MODERNTAP;
      var done = false;

      // Chip ID comes from the address: /t/CHIP_ID (or tap.html?chip=CHIP_ID).
      var match = location.pathname.match(/^\/t\/([^\/?#]+)/);
      var chip = match ? decodeURIComponent(match[1])
                       : new URLSearchParams(location.search).get('chip') || '';

      var ua = navigator.userAgent;
      var device = /iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) ? 'tablet'
                 : /Mobi|iPhone|Android/i.test(ua) ? 'phone'
                 : 'desktop';

      function safe(url) {
        return /^https?:\/\//i.test(url || '') ? url : cfg.FALLBACK_URL;
      }

      function go(url) {
        if (done) return;
        done = true;
        url = safe(url);
        document.getElementById('manual-link').href = url;
        document.getElementById('manual').classList.remove('hidden');
        location.replace(url);
      }

      // Never leave a guest stuck: forward to the fallback if the API is slow.
      setTimeout(function () { go(cfg.FALLBACK_URL); }, cfg.TAP_TIMEOUT_MS);

      if (!chip) { go(cfg.FALLBACK_URL); return; }

      var api = cfg.API_URL + '?action=tap&chip=' + encodeURIComponent(chip) + '&d=' + device;
      fetch(api)
        .then(function (r) { return r.json(); })
        .then(function (data) { go(data.url); })
        .catch(function () { go(cfg.FALLBACK_URL); });
    })();
  </script>
</body>
</html>
